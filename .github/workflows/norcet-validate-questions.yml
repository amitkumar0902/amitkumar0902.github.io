# Validates NORCET question banks when JSON changes
name: NORCET question banks

on:
  pull_request:
    paths:
      - 'norcetprep/data/**'
      - 'norcetprep/index.html'
      - 'norcetprep/scripts/**'
      - 'functions/**'
  push:
    branches: [main, master]
    paths:
      - 'norcetprep/data/**'
      - 'norcetprep/index.html'
      - 'norcetprep/scripts/**'
      - 'functions/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate all question JSON
        run: node norcetprep/scripts/validate-questions.mjs
      - name: Hub card counts vs JSON
        run: node norcetprep/scripts/check-index-counts.mjs
      - name: Content consistency gate on the golden set
        run: node norcetprep/scripts/verify-questions.mjs --golden --static-only
      - name: Payment webhook behaviour tests
        working-directory: functions
        run: npm test
