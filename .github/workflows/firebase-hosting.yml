# Deploys the norcetprep/ directory to Firebase Hosting (nursedrill.com).
# Inert until the repo variable FIREBASE_DEPLOY_ENABLED is set to 'true'
# and the FIREBASE_SERVICE_ACCOUNT_NURSEDRILL secret exists — see norcetprep/DEPLOY.md.
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
    paths:
      - 'norcetprep/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.FIREBASE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NURSEDRILL }}
          channelId: live
          projectId: nursedrill-web
