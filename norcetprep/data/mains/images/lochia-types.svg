<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="Lochia phases chart">
  <style>
    .bg { fill: #faf7f5; }
    .label { font-family: 'Georgia', serif; font-weight: 600; fill: #1a1a1a; }
    .sub { font-family: 'Helvetica', sans-serif; fill: #555; font-size: 11px; }
    .title { font-family: 'Georgia', serif; font-weight: 700; fill: #8b0000; font-size: 15px; letter-spacing: .4px; }
  </style>
  <rect class="bg" width="640" height="240"/>
  <text class="title" x="20" y="30">Lochia  postpartum discharge phases</text>

  <g transform="translate(20,60)">
    <rect x="0" y="0" width="190" height="130" fill="#a83232" rx="4"/>
    <text class="label" x="12" y="26" fill="#fff" font-size="18">Lochia Rubra</text>
    <text class="sub" x="12" y="48" fill="#ffeaea">Days 13</text>
    <text class="sub" x="12" y="70" fill="#ffeaea">Bright red · blood + decidua</text>
    <text class="sub" x="12" y="90" fill="#ffeaea">Small clots OK</text>
    <text class="sub" x="12" y="112" fill="#ffeaea" font-style="italic">Moderate flow; should be &lt;1 pad/hr</text>
  </g>

  <g transform="translate(225,60)">
    <rect x="0" y="0" width="190" height="130" fill="#d08a8a" rx="4"/>
    <text class="label" x="12" y="26" fill="#3a0d0d" font-size="18">Lochia Serosa</text>
    <text class="sub" x="12" y="48" fill="#3a0d0d">Days 410</text>
    <text class="sub" x="12" y="70" fill="#3a0d0d">Pinkbrown · serum + leucocytes</text>
    <text class="sub" x="12" y="90" fill="#3a0d0d">Decreasing volume</text>
    <text class="sub" x="12" y="112" fill="#3a0d0d" font-style="italic">Reversion to rubra = red flag</text>
  </g>

  <g transform="translate(430,60)">
    <rect x="0" y="0" width="190" height="130" fill="#f0e4d7" rx="4"/>
    <text class="label" x="12" y="26" fill="#3a2a10" font-size="18">Lochia Alba</text>
    <text class="sub" x="12" y="48" fill="#3a2a10">Day 10  6 weeks</text>
    <text class="sub" x="12" y="70" fill="#3a2a10">Whitishyellow · leucocytes</text>
    <text class="sub" x="12" y="90" fill="#3a2a10">Scant flow</text>
    <text class="sub" x="12" y="112" fill="#3a2a10" font-style="italic">Fresh bleeding = late PPH</text>
  </g>

  <text class="sub" x="20" y="218">Offensive odour + fever + uterine tenderness = puerperal endometritis  escalate.</text>
</svg>
