<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="PPH 4 Ts chart">
  <style>
    .bg { fill: #faf7f5; }
    .title { font-family: 'Georgia', serif; font-weight: 700; fill: #8b0000; font-size: 16px; letter-spacing: .4px; }
    .head  { font-family: 'Georgia', serif; font-weight: 700; fill: #fff; font-size: 18px; }
    .pct   { font-family: 'Helvetica', sans-serif; fill: #fff; font-size: 12px; font-weight: 600; }
    .body  { font-family: 'Helvetica', sans-serif; fill: #1a1a1a; font-size: 12px; }
    .foot  { font-family: 'Helvetica', sans-serif; fill: #555; font-size: 11px; }
  </style>
  <rect class="bg" width="640" height="320"/>
  <text class="title" x="20" y="28">Postpartum Hemorrhage  the 4 Ts</text>

  <g transform="translate(20,50)">
    <rect x="0" y="0" width="140" height="240" fill="#8b0000" rx="6"/>
    <text class="head" x="14" y="28">TONE</text>
    <text class="pct"  x="14" y="48">7080 %</text>
    <text class="body" x="10" y="90" fill="#ffeaea">Atonic uterus</text>
    <text class="body" x="10" y="110" fill="#ffeaea">Over-distension</text>
    <text class="body" x="10" y="130" fill="#ffeaea">Prolonged labour</text>
    <text class="body" x="10" y="150" fill="#ffeaea">Chorioamnionitis</text>
    <text class="foot" x="10" y="200" fill="#ffeaea" font-style="italic">1st line: massage +</text>
    <text class="foot" x="10" y="216" fill="#ffeaea" font-style="italic">oxytocin 10 IU IM</text>
  </g>

  <g transform="translate(170,50)">
    <rect x="0" y="0" width="140" height="240" fill="#b03a2e" rx="6"/>
    <text class="head" x="14" y="28">TRAUMA</text>
    <text class="pct"  x="14" y="48">~20 %</text>
    <text class="body" x="10" y="90" fill="#ffeaea">Lacerations</text>
    <text class="body" x="10" y="110" fill="#ffeaea">Episiotomy</text>
    <text class="body" x="10" y="130" fill="#ffeaea">Uterine rupture</text>
    <text class="body" x="10" y="150" fill="#ffeaea">Inversion</text>
    <text class="foot" x="10" y="200" fill="#ffeaea" font-style="italic">Direct visualisation</text>
    <text class="foot" x="10" y="216" fill="#ffeaea" font-style="italic">+ immediate repair</text>
  </g>

  <g transform="translate(320,50)">
    <rect x="0" y="0" width="140" height="240" fill="#c0392b" rx="6"/>
    <text class="head" x="14" y="28">TISSUE</text>
    <text class="pct"  x="14" y="48">~10 %</text>
    <text class="body" x="10" y="90" fill="#ffeaea">Retained placenta</text>
    <text class="body" x="10" y="110" fill="#ffeaea">Retained clots</text>
    <text class="body" x="10" y="130" fill="#ffeaea">Placenta accreta</text>
    <text class="body" x="10" y="150" fill="#ffeaea">Succenturiate lobe</text>
    <text class="foot" x="10" y="200" fill="#ffeaea" font-style="italic">Manual removal +</text>
    <text class="foot" x="10" y="216" fill="#ffeaea" font-style="italic">exploration</text>
  </g>

  <g transform="translate(470,50)">
    <rect x="0" y="0" width="140" height="240" fill="#7b241c" rx="6"/>
    <text class="head" x="14" y="28">THROMBIN</text>
    <text class="pct"  x="14" y="48">&lt;1 %</text>
    <text class="body" x="10" y="90" fill="#ffeaea">DIC</text>
    <text class="body" x="10" y="110" fill="#ffeaea">Abruption</text>
    <text class="body" x="10" y="130" fill="#ffeaea">HELLP</text>
    <text class="body" x="10" y="150" fill="#ffeaea">Pre-existing coag disorder</text>
    <text class="foot" x="10" y="200" fill="#ffeaea" font-style="italic">Component therapy +</text>
    <text class="foot" x="10" y="216" fill="#ffeaea" font-style="italic">tranexamic acid</text>
  </g>

  <text class="foot" x="20" y="310">Escalation ladder: massage ’ oxytocin ’ carboprost 250 mcg IM (avoid in asthma) ’ misoprostol ’ balloon ’ B-Lynch ’ artery ligation ’ hysterectomy.</text>
</svg>
