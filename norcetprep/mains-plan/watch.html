<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch · NORCET High-Yield Lectures</title>
  <meta name="description" content="Watch the High-Yield Topics NORCET YouTube playlist here, with per-episode syllabus topic linkage.">
  <link rel="canonical" href="https://amitkumar0902.github.io/norcetprep/mains-plan/watch.html">
  <link rel="stylesheet" href="../css/mains-theme.css">
  <link rel="manifest" href="../manifest.webmanifest">
  <script src="../js/core.js" defer></script>
  <style>
    .video-wrap { position: relative; padding-top: 56.25%; margin: 1rem 0; background: #000; border-radius: 8px; overflow: hidden; }
    .video-wrap iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:0; }
    .ep-list { list-style: none; padding: 0; margin: 1rem 0; }
    .ep-item { padding: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: background 0.15s; }
    .ep-item:hover { background: rgba(255,255,255,0.03); }
    .ep-item.active { background: rgba(60,160,255,0.1); border-left: 3px solid var(--accent, #4ae); }
    .ep-item .title { font-weight: 600; display: block; margin-bottom: 0.25rem; }
    .ep-item .topics { font-size: 0.82rem; color: var(--muted, #888); }
    .ep-item .topics a { color: inherit; text-decoration: underline dotted; margin-right: 0.5rem; }
    .playlist-link { display: inline-block; margin: 1rem 0; padding: 0.5rem 1rem; background: #c4302b; color: #fff; border-radius: 4px; text-decoration: none; font-weight: 600; }
    .playlist-link:hover { background: #a52622; }
  </style>
  <script defer>
    document.addEventListener('DOMContentLoaded', async () => {
      NM.boot('watch');
      const res = await fetch('../data/mains/videos.json');
      const data = await res.json();
      const syllabus = await fetch('../data/mains/syllabus.json').then(r => r.json());
      const syllById = {};
      syllabus.forEach(s => { syllById[s.id] = s; });

      document.getElementById('playlist-title').textContent = data.playlistTitle || 'High-Yield NORCET Playlist';
      document.getElementById('playlist-url').href = data.playlistUrl;

      const initialV = new URLSearchParams(location.search).get('v');
      const initial = data.episodes.find(e => e.videoId === initialV) || data.episodes[0];

      function loadEpisode(ep) {
        if (!ep) return;
        const iframe = document.getElementById('player');
        iframe.src = `https://www.youtube-nocookie.com/embed/${ep.videoId}?list=${data.playlistId}&autoplay=0&rel=0`;
        document.getElementById('current-title').textContent = ep.title;
        const related = document.getElementById('related-topics');
        related.innerHTML = '';
        for (const tid of (ep.topics || [])) {
          const s = syllById[tid];
          if (!s) continue;
          const li = document.createElement('li');
          li.innerHTML = `<strong>${s.topic}</strong> <a href="syllabus.html#${tid}" class="muted">notes</a> <a href="bank.html?syllabusId=${encodeURIComponent(tid)}" class="muted">mcqs</a>`;
          related.appendChild(li);
        }
        document.querySelectorAll('.ep-item').forEach(el => el.classList.toggle('active', el.dataset.v === ep.videoId));
        history.replaceState(null, '', '?v=' + ep.videoId);
      }

      const list = document.getElementById('episodes');
      for (const ep of data.episodes) {
        const li = document.createElement('li');
        li.className = 'ep-item';
        li.dataset.v = ep.videoId;
        const topicLinks = (ep.topics || []).map(tid => {
          const s = syllById[tid];
          return s ? `<a href="syllabus.html#${tid}" onclick="event.stopPropagation()">${s.topic}</a>` : '';
        }).filter(Boolean).join(' · ');
        li.innerHTML = `
          <span class="title">Ep ${ep.episode}: ${ep.title}</span>
          <span class="topics">${topicLinks || '<em>No linked topics yet</em>'}</span>
        `;
        li.addEventListener('click', () => loadEpisode(ep));
        list.appendChild(li);
      }

      loadEpisode(initial);
    });
  </script>
</head>
<body>
<main class="page" id="main">
  <a class="back" href="index.html">← Back to 13-Day Plan</a>
  <h1 id="playlist-title">High-Yield Lectures</h1>
  <p class="muted">Watch scenario-based NORCET lectures alongside your notes. Click a topic link to jump to its syllabus entry.</p>

  <div class="video-wrap">
    <iframe id="player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>
  <h2 id="current-title" style="margin-top:1rem"></h2>
  <p><a class="playlist-link" id="playlist-url" target="_blank" rel="noopener">Open full playlist on YouTube</a></p>

  <h3>Syllabus topics covered in this episode</h3>
  <ul id="related-topics" class="lecture-list"></ul>

  <h3>All episodes</h3>
  <ul id="episodes" class="ep-list"></ul>
</main>
</body>
</html>
