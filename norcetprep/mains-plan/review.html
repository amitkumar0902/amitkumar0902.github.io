<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Drill (SRS) · NORCET Mains 2026</title>
  <link rel="stylesheet" href="../css/mains-theme.css">
  <link rel="manifest" href="../manifest.webmanifest">
  <script src="../js/core.js" defer></script>
  <script src="../js/practice.js" defer></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', async () => {
      NM.boot('today');
      const dueIds = new Set(NM.srsDueIds().map(String));
      const bank = await NM.data('../data/mains/question-bank.json');
      const dueQs = bank.filter(q => dueIds.has(String(q.id)));
      const host = document.getElementById('review-root');
      if (dueQs.length === 0) {
        host.innerHTML = '<h1>Review Drill</h1><p>No cards due — clean sweep.</p><p><a href="index.html" class="btn btn--ghost">Back to plan</a></p>';
        return;
      }
      const url = URL.createObjectURL(new Blob([JSON.stringify(dueQs)], { type: 'application/json' }));
      NMPractice.start({
        title: 'Review Drill · ' + dueQs.length + ' due cards',
        dataUrl: url,
        stateKey: 'srs.review.session'
      });
      NM.set('srsReviewedDate', new Date().toISOString().slice(0,10));
    });
  </script>
</head>
<body>
<main class="page" id="main">
  <a class="back" href="index.html">← Back to Plan</a>
  <div id="review-root"><div id="practice-root"><p class="muted">Loading due cards…</p></div></div>
</main>
</body>
</html>
