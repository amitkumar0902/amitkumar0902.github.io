<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drug Calculation Drill · NORCET Mains 2026</title>
  <link rel="stylesheet" href="../../css/mains-theme.css">
  <link rel="manifest" href="../../manifest.webmanifest">
  <script src="../../js/core.js" defer></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      NM.boot('today');
      fetch('../../data/mains/drill-drug-calc.json').then(r => r.json()).then(start);
    });

    function start(qs) {
      const PER_Q = 30;
      const host = document.getElementById('drill');
      let i = 0, score = 0, times = [], answers = [];
      let remaining = PER_Q, timerId = null, begin = 0;

      function next() {
        if (i >= qs.length) return finish();
        const q = qs[i];
        remaining = PER_Q; begin = Date.now();
        host.innerHTML =
          '<div class="small muted">Q ' + (i+1) + ' / ' + qs.length + ' · <span class="mono" id="tmr">' + PER_Q + 's</span> · No calculator</div>' +
          '<div class="progress-bar"><div class="progress-bar__fill" id="pb" style="width:100%"></div></div>' +
          '<div class="q-stem" style="margin-top:14px">' + NM.escape(q.question) + '</div>' +
          '<ul class="options" id="opts">' +
            q.options.map((o, j) => '<li class="option" data-i="'+j+'"><span class="letter">'+['A','B','C','D'][j]+'</span><span class="text">'+NM.escape(o)+'</span></li>').join('') +
          '</ul>';
        host.querySelectorAll('.option').forEach(el => el.addEventListener('click', () => pick(+el.dataset.i)));
        clearInterval(timerId);
        timerId = setInterval(tick, 1000);
      }
      function tick() {
        remaining -= 1;
        document.getElementById('tmr').textContent = remaining + 's';
        document.getElementById('pb').style.width = (remaining/30*100) + '%';
        if (remaining <= 0) { clearInterval(timerId); pick(null); }
      }
      function pick(j) {
        clearInterval(timerId);
        const q = qs[i];
        const elapsed = Math.min(30, (Date.now() - begin) / 1000);
        times.push(elapsed);
        const correct = j === q.correct;
        if (correct) score++;
        answers.push({ i, pick: j, correct, elapsed });
        // flash feedback
        const opts = document.querySelectorAll('.option');
        opts.forEach((el, k) => {
          if (k === q.correct) el.classList.add('correct');
          else if (k === j) el.classList.add('wrong');
        });
        setTimeout(() => { i++; next(); }, 900);
      }
      function finish() {
        const avg = times.reduce((a,b)=>a+b,0) / Math.max(1,times.length);
        const slow = [...answers].sort((a,b)=>b.elapsed-a.elapsed).slice(0,5);
        host.innerHTML =
          '<h2>Drill complete</h2>' +
          '<p><strong>' + score + ' / ' + qs.length + '</strong> correct · average time ' + avg.toFixed(1) + 's.</p>' +
          '<h3>Slowest 5</h3>' +
          '<ol>' + slow.map(s => '<li>' + NM.escape(qs[s.i].question.slice(0,90)) + ' · ' + s.elapsed.toFixed(1) + 's · ' + (s.correct?'correct':'wrong') + '</li>').join('') + '</ol>' +
          '<div class="btn-row"><button class="btn btn--accent" id="again">Drill again</button><a class="btn btn--ghost" href="../index.html">Back</a></div>';
        document.getElementById('again').addEventListener('click', () => { i=0; score=0; times=[]; answers=[]; next(); });
        NM.recordActivity(Math.max(1, Math.round((times.reduce((a,b)=>a+b,0))/60)), qs.length);
      }
      next();
    }
  </script>
</head>
<body>
<main class="page" id="main">
  <a class="back" href="../index.html">← Back to Plan</a>
  <h1>Drug Calculation Drill</h1>
  <p class="muted">50 calc MCQs · 30 seconds each · no calculator · auto-advance on timeout. Builds the reflex you need for mock-day speed.</p>
  <div id="drill"><p>Loading drill…</p></div>
</main>
</body>
</html>
